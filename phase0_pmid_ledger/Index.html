<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMID確認台帳 TEST</title>
  <style>
    :root { color-scheme: light; font: 16px/1.65 system-ui, sans-serif; color: #20313b; background: #f5f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; } main { max-width: 1060px; margin: auto; padding: 24px; }
    h1 { font-size: 1.6rem; margin: 0; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
    .label { color: #0c655c; font-weight: 700; letter-spacing: .08em; }
    .muted { color: #53616a; font-size: .9rem; } .notice { background: #fff4d6; padding: 14px; border-radius: 10px; }
    button, select, .download { min-height: 48px; padding: 10px 14px; font: inherit; border: 1px solid #acbbc1; border-radius: 8px; background: white; color: #20313b; }
    button, .download { cursor: pointer; } button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid #b45900; outline-offset: 3px; }
    .primary, nav button[aria-pressed="true"] { background: #126c62; color: white; border-color: #126c62; }
    .toolbar, .actions, .links { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .toolbar { margin: 18px 0; } nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 18px 0; }
    nav button { text-align: left; } nav strong { display: block; font-size: 1.3rem; }
    #feedback { min-height: 32px; white-space: pre-wrap; } .error { color: #a5201c; } .success { color: #0c655c; }
    article { background: white; border: 1px solid #d8e0e4; border-radius: 12px; padding: 18px; margin: 12px 0; }
    article h2 { margin: 5px 0 12px; overflow-wrap: anywhere; }
    a { color: #075f92; } .links a { display: inline-flex; align-items: center; min-height: 48px; }
    .badge { display: inline-block; background: #edf4f2; padding: 3px 10px; border-radius: 20px; font-size: .9rem; }
    .test-toggle { display: flex; align-items: center; min-height: 48px; gap: 8px; } input[type="checkbox"] { width: 22px; height: 22px; }
    dialog { width: min(760px, calc(100% - 24px)); max-height: 90dvh; border: 1px solid #acbbc1; border-radius: 12px; padding: 20px; }
    dialog::backdrop { background: #172e3e77; } .detail-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .detail-heading { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    textarea { width: 100%; min-height: 90px; font: 16px monospace; } #export-area { background: white; padding: 16px; border-radius: 10px; }
    [hidden] { display: none !important; }
    @media(max-width: 720px) { main { padding: 14px; } nav { grid-template-columns: repeat(2, 1fr); } nav button:last-child { grid-column: 1 / -1; } .actions select { width: 100%; } article { padding: 14px; } }
  </style>
</head>
<body><main>
  <div class="label">TEST ONLY · PHASE 0</div>
  <h1>PMID 論文確認台帳</h1>
  <p class="notice">すべて架空の試験データです。PMIDのリンク先とタイトル・要約は無関係です。出力したファイルを原文取得アプリで実処理しないでください。OpenAI APIは使用しません。</p>
  <nav id="tabs" aria-label="確認状況"></nav>
  <div class="toolbar"><button id="reload">再読み込み</button><button id="export">原文入手希望をTXT出力</button></div>
  <label class="test-toggle"><input id="fail-next" type="checkbox">TEST：次の保存を失敗させる（データは変更しません）</label>
  <div id="feedback" role="status" aria-live="polite">画面を起動しています。表示が変わらない場合は、ページを再読み込みしてください。</div>
  <p id="range" class="muted"></p>
  <section id="papers" aria-label="論文一覧"></section>
  <div class="toolbar"><button id="prev">前のページ</button><button id="next">次のページ</button></div>
  <section id="export-area" hidden><h2>出力を準備しました</h2><p id="export-info"></p><a id="download" class="download primary" download="pmids.txt">pmids.txt をダウンロード</a><p class="muted">iPadではリンクをタップして「ダウンロード」を選びます。ファイルはUTF-8・BOMなしです。下欄は確認用です。</p><textarea id="export-text" readonly aria-label="出力PMID"></textarea></section>
  <dialog id="detail" aria-labelledby="detail-title"><div class="detail-heading"><h2 id="detail-title">掲載時の内容</h2><button id="close-detail">閉じる</button></div><div id="detail-body"></div></dialog>
</main>
<script>
// Keep startup error reporting separate so a syntax error in the main script is visible.
(function () {
  function showStartupError(message) {
    var status = document.getElementById('feedback');
    status.textContent = '画面の処理に失敗しました。保存結果はこの表示だけでは判断できません。再読み込みしてください。詳細：' + message;
    status.className = 'error';
  }
  window.addEventListener('error', function (event) { showStartupError(event.message || 'JavaScriptを実行できませんでした。'); });
  window.addEventListener('unhandledrejection', function (event) { showStartupError(event.reason && event.reason.message || '処理を完了できませんでした。'); });
}());
</script>
<script>
'use strict';
const el = id => document.getElementById(id);
let currentTab = 'recent', offset = 0, current = null, busy = false, exportUrl = null;
const attempts = new Map();
// google.script.run may reorder object keys in transit; UI order is explicit.
const tabOrder = ['recent', 'want', 'obtained', 'old', 'done'];
const statusOrder = ['unreviewed', 'reviewed_no_fulltext', 'want_fulltext', 'fulltext_obtained', 'read'];
function node(tag, text, cls) { const n = document.createElement(tag); if (text !== undefined) n.textContent = text; if (cls) n.className = cls; return n; }
function feedback(text, kind = '') { el('feedback').textContent = text; el('feedback').className = kind; }
function setBusy(value) { busy = value; document.querySelectorAll('main button, main select, main input').forEach(n => { if (n.id !== 'close-detail') n.disabled = value; }); if (!value && current) { el('prev').disabled = offset === 0; el('next').disabled = offset + current.page_size >= current.total; } }
function rpc(name, arg) {
  return new Promise((resolve, reject) => {
    let done = false;
    const timer = setTimeout(() => { done = true; reject(new Error('応答を確認できません。保存結果は不明です。再読み込みで状態を確認するか、同じ操作を再試行してください。')); }, 20000);
    const finish = fn => result => { if (done) return; done = true; clearTimeout(timer); fn(result); };
    google.script.run.withSuccessHandler(finish(resolve)).withFailureHandler(finish(error => reject(new Error(error.message || String(error)))))[name](arg);
  });
}
function safeLink(url, label, kind) {
  try { const parsed = new URL(url); const valid = parsed.protocol === 'https:' && (kind === 'pubmed' ? parsed.hostname === 'pubmed.ncbi.nlm.nih.gov' : parsed.hostname === 'docs.google.com' && /^\/document\/d\/[A-Za-z0-9_-]+\//.test(parsed.pathname));
    if (!valid) return node('span', 'リンク情報なし', 'muted');
    const a = node('a', label); a.href = parsed.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a;
  } catch { return node('span', 'リンク情報なし', 'muted'); }
}
async function load(clearMessage = true) {
  setBusy(true); if (clearMessage) feedback('読み込み中…');
  try { current = await rpc('listPapers', { tab: currentTab, offset }); render(); if (clearMessage) feedback(''); }
  catch (error) { feedback(error.message, 'error'); }
  finally { setBusy(false); }
}
function render() {
  el('tabs').replaceChildren();
  for (const key of tabOrder) {
    const label = current.tabs[key];
    const button = node('button', label); button.append(node('strong', String(current.counts[key]))); button.setAttribute('aria-pressed', String(key === currentTab));
    button.onclick = () => { if (busy) return; currentTab = key; offset = 0; load(); }; el('tabs').append(button);
  }
  el('range').textContent = `直近3か月：${current.boundary}〜${current.today}（日本時間）｜${current.total}件中 ${current.total ? offset + 1 : 0}〜${Math.min(offset + current.page_size, current.total)}件。日付不明は「過去の未確認」に含みます。`;
  el('papers').replaceChildren();
  if (!current.items.length) el('papers').append(node('p', 'この区分の論文はありません。'));
  for (const paper of current.items) {
    const card = node('article'); card.append(node('div', `PMID ${paper.pmid} ｜ ${paper.reference_date || '日付不明'} 配信`, 'muted'), node('h2', paper.title), node('p', paper.topics), node('span', current.statuses[paper.review_status], 'badge'));
    const actions = node('div', undefined, 'actions'); const select = node('select'); select.setAttribute('aria-label', `PMID ${paper.pmid}の確認状態`);
    for (const value of statusOrder) { const option = node('option', current.statuses[value]); option.value = value; select.append(option); } select.value = paper.review_status;
    const save = node('button', '状態を保存'); save.onclick = () => saveStatus(paper, select.value);
    const want = node('button', '原文入手希望に追加', 'primary'); want.onclick = () => saveStatus(paper, 'want_fulltext');
    actions.append(select, save); if (['unreviewed', 'reviewed_no_fulltext'].includes(paper.review_status)) actions.append(want);
    const links = node('div', undefined, 'links'); const detail = node('button', '配信時の要約・掲載履歴'); detail.onclick = () => showDetail(paper.pmid);
    // HtmlService can strip // as a comment inside a URL template literal. Use a quoted string.
    links.append(detail, safeLink('https://pubmed.ncbi.nlm.nih.gov/' + paper.pmid + '/', 'PubMed ↗', 'pubmed'));
    card.append(actions, links); if (paper.note) card.append(node('p', `メモ（試験では閲覧のみ）：${paper.note}`, 'muted'));
    el('papers').append(card);
  }
}
async function saveStatus(paper, status) {
  if (busy) return;
  setBusy(true); feedback('保存中…');
  const simulate = el('fail-next').checked;
  const key = `${paper.pmid}:${paper.review_version}:${status}:${simulate}`;
  if (!attempts.has(key)) attempts.set(key, crypto.randomUUID());
  try {
    const result = await rpc('changeStatus', { pmid: paper.pmid, status, expected_version: paper.review_version, operation_id: attempts.get(key), simulate_failure: simulate });
    if (!result || result.saved !== true || result.paper.review_status !== status) throw new Error('保存の確認ができません。再読み込みしてください。');
    attempts.delete(key); el('fail-next').checked = false; el('export-area').hidden = true;
    feedback(`PMID ${paper.pmid}：${current.statuses[status]}を保存しました。`, 'success');
    await load(false);
  } catch (error) { feedback(error.message, 'error'); }
  finally { setBusy(false); }
}
async function showDetail(pmid) {
  if (busy) return; setBusy(true); feedback('掲載履歴を読み込み中…');
  try {
    const result = await rpc('getPaperDetail', pmid); el('detail-title').textContent = `PMID ${pmid}：配信時の内容`; el('detail-body').replaceChildren(node('p', result.paper.title));
    for (const h of result.appearances) {
      const article = node('article'); article.append(node('h3', `${h.delivered_date || '配信日不明'} ｜ ${h.topic_label}`), node('p', `配信ID：${h.issue_id} / ${h.selection}`), node('p', `当時のタイトル：${h.title_at_delivery}`, 'detail-text'));
      for (const [key, label] of [['summary_ja', '日本語要約'], ['one_line_assessment', '一行評価'], ['why_important', '評価理由'], ['importance', '重要度']]) article.append(node('h3', label), node('p', h[key] || '保存なし（再生成はしません）', 'detail-text'));
      article.append(node('p', `出典：${h.source_kind} / ${h.source_ref}`, 'muted'));
      if (h.current_doc_url) { article.append(safeLink(h.current_doc_url, 'Googleドキュメント（現在版）↗', 'doc'), node('p', 'リンク動作の試験用です。サンプルの出典ではありません。CURRENT文書は上書きされるため、当時の掲載内容を保証しません。', 'muted')); }
      el('detail-body').append(article);
    }
    if (!result.appearances.length) el('detail-body').append(node('p', '掲載履歴は保存されていません。'));
    el('detail').showModal(); feedback('');
  } catch (error) { feedback(error.message, 'error'); } finally { setBusy(false); }
}
el('reload').onclick = () => load();
el('prev').onclick = () => { offset = Math.max(0, offset - current.page_size); load(); };
el('next').onclick = () => { offset += current.page_size; load(); };
el('close-detail').onclick = () => el('detail').close();
el('export').onclick = async () => {
  if (busy) return; setBusy(true); feedback('出力を準備中…'); el('export-area').hidden = true;
  try {
    const result = await rpc('exportWanted');
    if (exportUrl) URL.revokeObjectURL(exportUrl);
    exportUrl = URL.createObjectURL(new Blob([result.text], { type: 'text/plain;charset=utf-8' }));
    el('download').href = exportUrl; el('export-text').value = result.text;
    el('export-info').textContent = `${result.count}件。全期間の「原文入手希望」を準備時点の状態で出力します。状態は変更しません。`;
    el('export-area').hidden = false; feedback('ダウンロードリンクをタップしてください。');
  } catch (error) { feedback(error.message, 'error'); } finally { setBusy(false); }
};
load();
</script>
</body></html>
