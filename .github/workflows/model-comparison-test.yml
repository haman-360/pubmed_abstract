name: PubMed model comparison TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare old and new models on the same PubMed abstracts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/model_comparison_test.py
          --topic peds_asthma_update
          --start 2026-09-12
          --end 2026-09-23
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-comparison-test
          path: model_comparison_test.json
          if-no-files-found: warn
