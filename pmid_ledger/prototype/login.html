<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Googleログイン確認 · PMID台帳</title>
<style>body{font:17px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#f5f7fa;color:#203046}main{background:white;padding:24px;border-radius:12px;border:1px solid #ccd6df}h1{font-size:25px}button{font:inherit;padding:12px 16px;margin:6px 6px 6px 0;cursor:pointer}#status{white-space:pre-wrap;line-height:1.7}#uid{overflow-wrap:anywhere}button:disabled{opacity:.5}</style>
<main><h1>Googleログインの確認</h1><p>追加費用0円のローカル試験です。実台帳には接続しません。</p>
<p id="status" role="status">ログインの準備をしています。</p>
<button id="login" disabled>Googleでログイン</button><button id="logout" disabled>サインアウト</button>
<button id="check" disabled>認証を再確認</button><button id="read" disabled>架空データを取得して確認</button>
<div id="identity" hidden><p id="account"></p><p>確認できたUID：<span id="uid"></span></p><p id="owner-state"></p></div>
<p>この画面の認証情報はメモリ内だけで扱います。再読み込み後は再度ログインしてください。</p></main>
<script type="module" src="/login-client.mjs"></script></html>
