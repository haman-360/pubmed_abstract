<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>クラウドTEST保存確認 · PMID台帳</title>
<style>body{font:17px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#f5f7fa;color:#203046}main{background:white;padding:24px;border-radius:12px;border:1px solid #ccd6df}h1{font-size:25px}button{font:inherit;padding:12px 16px;margin:6px 6px 6px 0;cursor:pointer}#status{white-space:pre-wrap;line-height:1.7}button:disabled{opacity:.5}</style>
<main><h1>クラウドTESTの保存確認</h1><p>架空120件だけの台帳です。実台帳には接続しません。</p>
<p id="status" role="status">ログインの準備をしています。</p>
<button id="login" disabled>Googleでログイン</button><button id="logout" disabled>サインアウト</button>
<button id="check" disabled>認証を再確認</button><button id="save" disabled>架空論文1件で保存を確認</button>
<p><button id="measure" disabled>操作別の速度を測る（各10回）</button><button id="cpu" disabled>CPU観測用の読取（30秒以内）</button></p>
<p>速度計測は一覧・論文一覧・詳細・架空1件保存を各10回行います。CPU観測は読取だけを最大80回行います。失敗時は停止し、自動再送しません。</p><pre id="measurements" style="white-space:pre-wrap;font-size:14px"></pre>
<p>保存確認は架空論文1件を「入手希望」にし、テスト用メモを記録します。保存後に読戻しと同じ操作の再送を確認します。</p>
<p>認証情報はこの画面のメモリ内だけで扱います。再読み込み後は再度ログインしてください。</p></main>
<script type="module" src="/login-client.mjs"></script></html>
